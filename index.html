<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>CSV Toolkit</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <aside class="sidebar" aria-label="Sidebar">
    <div class="sb-head">
      <span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9.5h18M9.5 9.5V20" stroke="currentColor" stroke-width="1.8"/></svg></span>
      <span class="app-name">CSV Toolkit</span>
    </div>
    <div class="sb-sec" id="sbTools">Tools</div>
    <nav class="nav" id="nav" aria-labelledby="sbTools"></nav>
  </aside>

  <div class="main">
    <header class="toolbar">
      <button type="button" class="tb-btn" id="tbSidebar" title="Hide Sidebar" aria-label="Hide Sidebar" aria-pressed="true">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M9 5v14M5.5 8.5h1.5M5.5 11h1.5"/></svg>
      </button>
      <div class="tb-title"><h1 id="winTitle">Split</h1><span id="winSub">No file open</span></div>
      <div class="tb-spacer"></div>
      <button type="button" class="btn" id="pick">Choose File…</button>
      <button type="button" class="tb-btn" id="tbInspector" title="Hide Inspector" aria-label="Hide Inspector" aria-pressed="true">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M15 5v14M17 8.5h1.5M17 11h1.5"/></svg>
      </button>
      <button type="button" class="btn accent" id="tbRun" hidden>Run</button>
    </header>

    <aside class="safe" aria-label="Privacy">
      <svg class="ill" viewBox="0 0 200 90" fill="none" stroke="var(--label2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="6" y="10" width="102" height="70" rx="8" fill="var(--content)"/>
        <path d="M6 26h102"/><circle cx="16" cy="18" r="2.6" fill="#FF5F57" stroke="none"/><circle cx="25" cy="18" r="2.6" fill="#FEBC2E" stroke="none"/><circle cx="34" cy="18" r="2.6" fill="#28C840" stroke="none"/>
        <path d="M20 38h44M20 48h44M20 58h28M34 34v30" stroke="var(--sep-strong)"/>
        <rect x="62" y="48" width="34" height="26" rx="6" fill="var(--accent)" stroke="none"/>
        <path d="M70 48v-6a9 9 0 0 1 18 0v6"/><circle cx="79" cy="60" r="2.6" fill="#fff" stroke="none"/><path d="M79 61v5" stroke="#fff"/>
        <path d="M116 45h30" stroke-dasharray="3 5"/>
        <path d="M160 70a14 14 0 0 1-2-27.8A18 18 0 0 1 192 46a12 12 0 0 1-2 24z" fill="var(--content)"/>
        <path d="M150 80L196 28" stroke="var(--red)" stroke-width="3"/>
      </svg>
      <span class="safe-mini" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      <div class="tx">
        <h2>Your files never leave this browser</h2>
        <p>Everything is read, processed and zipped on your own device. Nothing is uploaded, and there is no server to upload to.</p>
      </div>
      <ul>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>No upload</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>No server</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Works offline once loaded</li>
      </ul>
    </aside>

    <div id="views"></div>
  </div>
</div>

<script src="js/csv.js"></script>
<script src="js/core.js"></script>
<script src="js/tools/split.js"></script>
<script src="js/tools/merge.js"></script>
<script src="js/tools/inspect.js"></script>
<script src="js/tools/transform.js"></script>
<script src="js/tools/convert.js"></script>
<script>App.start();</script>
</body>
</html>
