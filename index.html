<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSV Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">

  <header class="top" id="top">
    <a class="wordmark" href="#/split" aria-label="CSV Toolkit, home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 9h19M9 9v11.5" stroke="currentColor" stroke-width="1.8"/><rect x="9" y="9" width="12.5" height="5.5" fill="currentColor" opacity=".25"/></svg>
      CSV Toolkit
    </a>
    <nav class="nav" id="nav" aria-label="Tools"></nav>
    <div class="tools">
      <div class="filechip" id="filechip" hidden>
        <div class="fc-txt"><span class="fc-name"></span><span class="fc-meta"></span></div>
        <button type="button" class="btn sm" id="fcChange">Change</button>
        <button type="button" class="icon-btn" id="fcClose" title="Close this file" aria-label="Close this file"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="seg theme" role="group" aria-label="Theme">
        <button id="thLight" type="button" aria-label="Light theme" title="Light theme"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button id="thDark" type="button" aria-label="Dark theme" title="Dark theme"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
      <button class="btn accent" id="pick" type="button">Choose CSV file</button>
    </div>
  </header>

  <aside class="safe" aria-label="Privacy">
    <svg class="ill" viewBox="0 0 200 90" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="6" y="10" width="102" height="70" rx="7" fill="var(--sheet)"/>
      <path d="M6 26h102"/><circle cx="16" cy="18" r="2" fill="var(--ink)" stroke="none"/><circle cx="24" cy="18" r="2" fill="var(--ink)" stroke="none"/><circle cx="32" cy="18" r="2" fill="var(--ink)" stroke="none"/>
      <path d="M20 38h44M20 48h44M20 58h28M34 34v30" stroke="var(--rule-strong)"/>
      <rect x="62" y="48" width="34" height="26" rx="5" fill="var(--accent)" stroke="var(--ink)"/>
      <path d="M70 48v-6a9 9 0 0 1 18 0v6"/><circle cx="79" cy="60" r="2.6" fill="#fff" stroke="none"/><path d="M79 61v5" stroke="#fff"/>
      <path d="M116 45h30" stroke-dasharray="3 5"/>
      <path d="M160 70a14 14 0 0 1-2-27.8A18 18 0 0 1 192 46a12 12 0 0 1-2 24z" fill="var(--sheet)"/>
      <path d="M150 80L196 28" stroke="var(--err)" stroke-width="3"/>
    </svg>
    <span class="safe-mini" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
    <div class="tx">
      <h2>Your files never leave this browser</h2>
      <p>Everything is read, processed and zipped on your own device. Nothing is uploaded, and there is no server to upload to.</p>
    </div>
    <ul>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>No upload</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>No server</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Works offline once loaded</li>
    </ul>
  </aside>

  <div id="views"></div>
</div>

<script src="js/csv.js"></script>
<script src="js/core.js"></script>
<script src="js/tools/split.js"></script>
<script src="js/tools/merge.js"></script>
<script src="js/tools/inspect.js"></script>
<script src="js/tools/transform.js"></script>
<script src="js/tools/convert.js"></script>
<script>App.start();</script>
</body>
</html>
