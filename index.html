<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSV Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">

  <nav class="side" id="side" aria-label="Tools"></nav>

  <header class="top" id="top">
    <div class="nav" id="nav" aria-label="Tools"></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Theme">
        <button id="thLight" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
        <button id="thDark" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Dark</button>
      </div>
      <button class="btn" id="pick" type="button">Choose CSV file</button>
    </div>
  </header>

  <aside class="safe" aria-label="Privacy">
    <svg class="ill" viewBox="0 0 200 90" fill="none" stroke="var(--ill)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="6" y="10" width="102" height="70" rx="9" fill="var(--card)"/>
      <path d="M6 26h102"/><circle cx="16" cy="18" r="2" fill="var(--ill)" stroke="none"/><circle cx="24" cy="18" r="2" fill="var(--ill)" stroke="none"/><circle cx="32" cy="18" r="2" fill="var(--ill)" stroke="none"/>
      <rect x="22" y="36" width="36" height="34" rx="5" fill="var(--accent-soft)"/>
      <path d="M30 46h20M30 53h20M30 60h12"/>
      <rect x="62" y="48" width="34" height="26" rx="7" fill="var(--ok)" stroke="var(--ill)"/>
      <path d="M70 48v-6a9 9 0 0 1 18 0v6"/><circle cx="79" cy="60" r="2.6" fill="#fff" stroke="none"/><path d="M79 61v5" stroke="#fff"/>
      <path d="M116 45h30" stroke-dasharray="3 5"/>
      <path d="M160 70a14 14 0 0 1-2-27.8A18 18 0 0 1 192 46a12 12 0 0 1-2 24z" fill="var(--card)"/>
      <path d="M150 80L196 28" stroke="var(--err)" stroke-width="3"/>
    </svg>
    <div class="tx">
      <h2>Your CSV never leaves your browser <em>100% private</em></h2>
      <p>Files are read, processed and zipped locally on your device. Nothing is uploaded to any server.</p>
    </div>
    <ul>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>No upload</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>No server</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>Processed locally</li>
    </ul>
  </aside>

  <div id="views"></div>
</div>

<script src="js/csv.js"></script>
<script src="js/core.js"></script>
<script src="js/tools/split.js"></script>
<script src="js/tools/merge.js"></script>
<script src="js/tools/inspect.js"></script>
<script src="js/tools/transform.js"></script>
<script src="js/tools/convert.js"></script>
<script>App.start();</script>
</body>
</html>
